<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;display=swap');
      .text { 
        font-family: 'Inter', sans-serif; 
        font-weight: 900; 
        font-size: 50px; 
        fill: #F5F5F0; 
      }
    </style>
  </defs>
  
  <!-- Blue Background -->
  <rect width="100" height="100" rx="20" fill="#2563E"/>
  
  <!-- Network Graph Lines (Subtle White) -->
  <g stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5">
    <line x1="20" y1="30" x2="40" y2="15" />
    <line x1="40" y1="15" x2="75" y2="20" />
    <line x1="75" y1="20" x2="85" y2="45" />
    <line x1="85" y1="45" x2="75" y2="80" />
    <line x1="75" y1="80" x2="45" y2="85" />
    <line x1="45" y1="85" x2="15" y2="70" />
    <line x1="15" y1="70" x2="20" y2="30" />
    
    <!-- Cross connections -->
    <line x1="40" y1="15" x2="85" y2="45" />
    <line x1="85" y1="45" x2="45" y2="85" />
    <line x1="45" y1="85" x2="20" y2="30" />
    
    <!-- Center reaching lines (behind text) -->
    <line x1="75" y1="20" x2="50" y2="50" />
    <line x1="15" y1="70" x2="50" y2="50" />
  </g>

  <!-- Network Graph Nodes -->
  <g fill="rgba(255, 255, 255, 0.5)">
    <circle cx="20" cy="30" r="2.5" />
    <circle cx="40" cy="15" r="3" />
    <circle cx="75" cy="20" r="2" />
    <circle cx="85" cy="45" r="3" />
    <circle cx="75" cy="80" r="2.5" />
    <circle cx="45" cy="85" r="3" />
    <circle cx="15" cy="70" r="2" />
    <circle cx="50" cy="50" r="2" />
    <!-- Floating particles -->
    <circle cx="10" cy="50" r="1.5" />
    <circle cx="90" cy="70" r="1.5" />
  </g>

  <!-- Main Text -->
  <text x="50" y="68" text-anchor="middle" class="text">ST</text>
</svg>
